[build]
target = "riscv64im-unknown-none-elf"
[target.riscv64im-unknown-none-elf]
linker = "riscv-none-elf-gcc"
rustflags = [
    "-C",
    "link-arg=-march=rv64im",
    "-C",
    "link-arg=-mabi=lp64",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=norelro",
    "-C",
    "link-arg=-nostartfiles",
]

# Environment variables for C/C++ compilation in build scripts
[env]

# riscv64im targets (for hypercube/SP1)
RUSTC_LINKER = "riscv-none-elf-ld"
CC_riscv64im_succinct_zkvm_elf = "riscv-none-elf-gcc"
CXX_riscv64im_succinct_zkvm_elf = "riscv-none-elf-g++"
CONAN_PROFILE_HOST = "riscv64-baremetal"

# Allow pkg-config to work with cross-compilation
PKG_CONFIG_ALLOW_CROSS = "1"
