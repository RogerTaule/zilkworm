<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 920" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1d2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b4c8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="proverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e4a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#163328;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="guestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2c1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33200f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c3317;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d2410;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="proofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1e5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#261340;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="targetsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111a11;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64b5f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#81c784"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ce93d8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffb74d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="920" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="430" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#e8eaf6" letter-spacing="2">z6m · Zilkworm Architecture</text>
  <text x="430" y="66" text-anchor="middle" font-size="12" fill="#7986cb">Ethereum ZK Block Prover — SP1 Hypercube</text>
  <line x1="60" y1="78" x2="800" y2="78" stroke="#2d3561" stroke-width="1"/>

  <!-- ═══ ETHEREUM NODE ═══ -->
  <rect x="200" y="96" width="460" height="90" rx="12" fill="url(#ethGrad)" stroke="#5c6bc0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#9fa8da">⟠  Ethereum Node</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#7986cb">Full execution node (Erigon / Geth / Reth)</text>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#5c6bc0">Provides blocks and witness via JSON-RPC</text>

  <!-- Arrow: Eth → Prover -->
  <line x1="430" y1="186" x2="430" y2="218" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <rect x="316" y="192" width="228" height="18" rx="4" fill="#0f1117" fill-opacity="0.8"/>
  <text x="430" y="205" text-anchor="middle" font-size="10" fill="#64b5f6">unified RLP (block + pre-state)</text>

  <!-- ═══ HOST PROVER ═══ -->
  <rect x="130" y="222" width="600" height="130" rx="12" fill="url(#proverGrad)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#a5d6a7">⚙  z6m_prover  (Rust host)</text>
  <text x="430" y="268" text-anchor="middle" font-size="11" fill="#66bb6a">prover/prover_hypercube/</text>

  <!-- Sub-boxes inside prover -->
  <rect x="155" y="278" width="168" height="54" rx="8" fill="#1b3a2a" stroke="#388e3c" stroke-width="1"/>
  <text x="239" y="299" text-anchor="middle" font-size="10" font-weight="bold" fill="#81c784">Block Fetcher</text>
  <text x="239" y="315" text-anchor="middle" font-size="9" fill="#4caf50">fetcher.rs</text>
  <text x="239" y="327" text-anchor="middle" font-size="9" fill="#388e3c">RPC → RLP serialization</text>

  <rect x="346" y="278" width="168" height="54" rx="8" fill="#1b3a2a" stroke="#388e3c" stroke-width="1"/>
  <text x="430" y="299" text-anchor="middle" font-size="10" font-weight="bold" fill="#81c784">SP1 Executor / Prover</text>
  <text x="430" y="315" text-anchor="middle" font-size="9" fill="#4caf50">service.rs</text>
  <text x="430" y="327" text-anchor="middle" font-size="9" fill="#388e3c">execute / prove / verify</text>

  <rect x="537" y="278" width="168" height="54" rx="8" fill="#1b3a2a" stroke="#388e3c" stroke-width="1"/>
  <text x="621" y="299" text-anchor="middle" font-size="10" font-weight="bold" fill="#81c784">Proof Writer</text>
  <text x="621" y="315" text-anchor="middle" font-size="9" fill="#4caf50">sp1-sdk</text>
  <text x="621" y="327" text-anchor="middle" font-size="9" fill="#388e3c">compressed / groth16</text>

  <!-- Arrow: Prover → Guest -->
  <line x1="430" y1="352" x2="430" y2="384" stroke="#ffb74d" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <rect x="304" y="358" width="252" height="18" rx="4" fill="#0f1117" fill-opacity="0.8"/>
  <text x="430" y="371" text-anchor="middle" font-size="10" fill="#ffb74d">SP1 zkVM execution  (rv64im ELF)</text>

  <!-- ═══ GUEST ═══ -->
  <rect x="100" y="388" width="660" height="296" rx="12" fill="url(#guestGrad)" stroke="#f57c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffcc80">◈  z6m_guest  (rv64im bare-metal ELF)</text>
  <text x="430" y="432" text-anchor="middle" font-size="11" fill="#ffa726">prover/guest_hypercube/  ·  cross-compiled via riscv-none-elf-g++</text>

  <!-- cxx-bridge label -->
  <rect x="340" y="440" width="180" height="20" rx="6" fill="#3e2000" stroke="#ff6f00" stroke-width="1"/>
  <text x="430" y="454" text-anchor="middle" font-size="10" fill="#ff8f00">cxx-bridge  (C++ ↔ Rust FFI)</text>

  <!-- ═══ C++ EVM Core ═══ -->
  <rect x="125" y="470" width="610" height="190" rx="10" fill="url(#cppGrad)" stroke="#e65100" stroke-width="1.5"/>
  <text x="430" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffab40">Zilkworm C++ EVM  (zilk_core/)</text>

  <!-- C++ sub-components -->
  <rect x="142" y="504" width="168" height="70" rx="7" fill="#2e1a0a" stroke="#bf360c" stroke-width="1"/>
  <text x="226" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8a65">StateTransition</text>
  <text x="226" y="540" text-anchor="middle" font-size="9" fill="#ff7043">state_transition.cpp</text>
  <text x="226" y="554" text-anchor="middle" font-size="9" fill="#bf360c">JSON / RLP inputs</text>
  <text x="226" y="566" text-anchor="middle" font-size="9" fill="#bf360c">block execution loop</text>

  <rect x="326" y="504" width="168" height="70" rx="7" fill="#2e1a0a" stroke="#bf360c" stroke-width="1"/>
  <text x="410" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8a65">EVMOne Interpreter</text>
  <text x="410" y="540" text-anchor="middle" font-size="9" fill="#ff7043">evmone/</text>
  <text x="410" y="554" text-anchor="middle" font-size="9" fill="#bf360c">opcode dispatch</text>
  <text x="410" y="566" text-anchor="middle" font-size="9" fill="#bf360c">stack / memory / gas</text>

  <rect x="510" y="504" width="210" height="70" rx="7" fill="#2e1a0a" stroke="#bf360c" stroke-width="1"/>
  <text x="615" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8a65">Precompiles</text>
  <text x="615" y="540" text-anchor="middle" font-size="9" fill="#ff7043">ECDSA · KZG · BLS12-381</text>
  <text x="615" y="554" text-anchor="middle" font-size="9" fill="#bf360c">SHA2 · RIPEMD · Blake2</text>
  <text x="615" y="566" text-anchor="middle" font-size="9" fill="#bf360c">ModExp · ECAdd/Mul</text>

  <!-- Silkworm row -->
  <rect x="142" y="584" width="578" height="62" rx="7" fill="#2e1a0a" stroke="#bf360c" stroke-width="1"/>
  <text x="431" y="604" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff8a65">Silkworm State Layer</text>
  <text x="269" y="622" text-anchor="middle" font-size="9" fill="#bf360c">RLP encoding/decoding</text>
  <text x="431" y="622" text-anchor="middle" font-size="9" fill="#bf360c">MPT state trie</text>
  <text x="593" y="622" text-anchor="middle" font-size="9" fill="#bf360c">account / storage model</text>
  <text x="431" y="638" text-anchor="middle" font-size="9" fill="#7e3300">SP1 syscalls (no OS, no heap allocator)</text>

  <!-- Arrow: Guest → Proof -->
  <line x1="430" y1="684" x2="430" y2="716" stroke="#ce93d8" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="316" y="690" width="228" height="18" rx="4" fill="#0f1117" fill-opacity="0.8"/>
  <text x="430" y="703" text-anchor="middle" font-size="10" fill="#ce93d8">ZK execution trace  →  STARK proof</text>

  <!-- ═══ PROOF ═══ -->
  <rect x="200" y="720" width="460" height="96" rx="12" fill="url(#proofGrad)" stroke="#9c27b0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="746" text-anchor="middle" font-size="13" font-weight="bold" fill="#e1bee7">✦  SP1 Hypercube Proof</text>
  <text x="430" y="766" text-anchor="middle" font-size="11" fill="#ba68c8">BaseFold / STARK  →  optional Groth16 wrap</text>
  <text x="430" y="786" text-anchor="middle" font-size="11" fill="#9c27b0">proves:  block N was executed correctly</text>
  <text x="430" y="804" text-anchor="middle" font-size="10" fill="#6a1b9a">verifiable on-chain or by light clients</text>

  <!-- ═══ FOUR TARGETS ═══ -->
  <rect x="60" y="832" width="740" height="68" rx="10" fill="url(#targetsGrad)" stroke="#37474f" stroke-width="1.5"/>
  <text x="430" y="852" text-anchor="middle" font-size="11" font-weight="bold" fill="#b0bec5">Execution Targets</text>

  <!-- Native -->
  <rect x="76" y="858" width="158" height="32" rx="6" fill="#1a2e1a" stroke="#43a047" stroke-width="1"/>
  <text x="155" y="871" text-anchor="middle" font-size="9" font-weight="bold" fill="#81c784">Native  (AppleClang)</text>
  <text x="155" y="883" text-anchor="middle" font-size="9" fill="#388e3c">2829 tests · ~12s</text>

  <!-- QEMU 64 -->
  <rect x="246" y="858" width="158" height="32" rx="6" fill="#1a271f" stroke="#00897b" stroke-width="1"/>
  <text x="325" y="871" text-anchor="middle" font-size="9" font-weight="bold" fill="#80cbc4">QEMU rv64im</text>
  <text x="325" y="883" text-anchor="middle" font-size="9" fill="#00695c">2829 tests · ~7.5 min</text>

  <!-- QEMU 32 -->
  <rect x="416" y="858" width="158" height="32" rx="6" fill="#1e1e2a" stroke="#1565c0" stroke-width="1"/>
  <text x="495" y="871" text-anchor="middle" font-size="9" font-weight="bold" fill="#90caf9">QEMU rv32im</text>
  <text x="495" y="883" text-anchor="middle" font-size="9" fill="#1565c0">2828 tests · ~25 min</text>

  <!-- SP1 -->
  <rect x="586" y="858" width="198" height="32" rx="6" fill="#2a1a2e" stroke="#8e24aa" stroke-width="1"/>
  <text x="685" y="871" text-anchor="middle" font-size="9" font-weight="bold" fill="#e1bee7">SP1 Hypercube  (ZK)</text>
  <text x="685" y="883" text-anchor="middle" font-size="9" fill="#7b1fa2">145 prague tests · ✓ all pass</text>

</svg>
